name: Manual Build VW

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run build script
        id: bugtool
        run: |
          python build/py/bugtool.py publish --github vw

      - name: Show outputs
        run: |
          echo "Commit:      ${{ steps.bugtool.outputs.commit }}"
          echo "Branch:      ${{ steps.bugtool.outputs.branch }}"
          echo "Variant ID:  ${{ steps.bugtool.outputs.variantid }}"
          echo "Version:     ${{ steps.bugtool.outputs.version }}"
          echo "Result File: ${{ steps.bugtool.outputs.resultfile }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-package
          path: artifacts/${{ steps.bugtool.outputs.resultfile }}
          archive: false
